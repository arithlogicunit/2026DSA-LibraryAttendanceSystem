<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Library Visit Desk</title>
    <link rel="stylesheet" href="ui-structure.css" />
  </head>

  <body>
    <main class="app-shell">
      <a class="skip-link" href="#main-content">Skip to main content</a>

      <div class="page-wrap">
        <header class="masthead">
          <div class="brand-mark">
            <img src="assets/NUD-LRC.jpg" alt="School Logo" />
          </div>

          <div class="system-name">
            <p class="school-name">National University - Dasmariñas</p>
            <h1>
              Attendance Monitoring<br />
              Library Management System
            </h1>
          </div>

          <div class="header-actions">
            <span id="session-label" class="session-label" hidden></span>
            <button id="logout-button" class="button button-header" type="button" hidden>Log out</button>
          </div>
        </header>

        <div id="main-content" class="page-stage">
          <section id="checking" class="panel narrow" aria-live="polite">
            <p class="eyebrow">Staff account</p>
            <h2>Checking access…</h2>
          </section>

          <section id="password-panel" class="panel narrow" aria-labelledby="pw-title" hidden>
            <div class="screen-heading">
              <p class="eyebrow">Staff account</p>
              <h2 id="pw-title">Change password</h2>
              <p>Enter your current password, then choose a new one.</p>
            </div>

            <form id="password-form" novalidate>
              <div class="field">
                <label for="current-password">Current password</label>
                <input id="current-password" name="current" type="password" autocomplete="current-password" required />
              </div>

              <div class="field">
                <label for="new-password">New password</label>
                <input id="new-password" name="next" type="password" autocomplete="new-password" required />
                <small>At least 8 characters, different from your current password.</small>
              </div>

              <div class="field">
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" name="confirm" type="password" autocomplete="new-password" required />
              </div>

              <p id="pw-message" class="validation-message" role="alert" hidden></p>

              <div class="form-actions">
                <a class="button button-secondary button-link" href="dashboard.html">Cancel</a>
                <button id="pw-button" class="button button-primary" type="submit">Change password</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="session-guard.js"></script>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const MIN_LENGTH = 8; // same rule as signup.html

      function showMessage(text, ok) {
        const el = $("#pw-message");
        el.textContent = text;
        el.style.color = ok ? "var(--success)" : "var(--danger)";
        el.hidden = false;
      }

      (async function start() {
        const guard = await SessionGuard.requireStaff();
        if (!guard) return;

        // header
        $("#session-label").textContent = `Signed in: ${guard.profile.staff_id}`;
        $("#session-label").hidden = false;
        $("#logout-button").hidden = false;
        $("#logout-button").addEventListener("click", () => SessionGuard.logout("welcome.html"));

        $("#checking").hidden = true;
        $("#password-panel").hidden = false;

        const form = $("#password-form");
        const button = $("#pw-button");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          $("#pw-message").hidden = true;

          const data = new FormData(form);
          const current = String(data.get("current"));
          const next = String(data.get("next"));
          const confirm = String(data.get("confirm"));

          if (!current) return showMessage("Enter your current password.", false);
          if (next.length < MIN_LENGTH) return showMessage(`New password must be at least ${MIN_LENGTH} characters.`, false);
          if (next === current) return showMessage("New password must be different from your current password.", false);
          if (next !== confirm) return showMessage("The two new passwords do not match.", false);

          button.disabled = true;
          try {
            // 1. Prove it is really them: re-check the current password.
            const verify = await db.auth.signInWithPassword({ email: guard.session.user.email, password: current });
            if (verify.error) {
              if (SessionGuard.isNetworkError(verify.error)) return showMessage(SessionGuard.MESSAGES.network, false);
              return showMessage("Current password is incorrect.", false);
            }

            // 2. Save the new password.
            const { error } = await db.auth.updateUser({ password: next });
            if (error) {
              if (SessionGuard.isSessionError(error)) return SessionGuard.endSession(SessionGuard.MESSAGES.expired);
              if (error.code === "same_password") return showMessage("New password must be different from your current password.", false);
              return showMessage(SessionGuard.friendlyMessage(error, error.message || "Could not change the password."), false);
            }

            // 3. Sign out any other devices that still use the old password (best effort).
            db.auth.signOut({ scope: "others" }).catch(() => {});

            form.reset();
            showMessage("Password changed. Use the new password the next time you log in.", true);
          } catch (err) {
            showMessage(SessionGuard.friendlyMessage(err, "Could not change the password. Please try again."), false);
          } finally {
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
