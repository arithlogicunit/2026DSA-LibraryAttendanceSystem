<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Currently In | Library Visit Desk</title>

    <link rel="stylesheet" href="ui-structure.css" />
  </head>

  <body data-requires-session="true" data-requires-permission="view_currently_in">
    <main class="app-shell">
      <a
        class="skip-link"
        href="#main-content"
      >
        Skip to main content
      </a>

      <div class="page-wrap">
        <header class="masthead">
          <div class="brand-mark">
            <img
              src="assets/NUD-LRC.jpg"
              alt="School Logo"
            />
          </div>

          <div class="system-name">
            <p class="school-name">
              National University - Dasmariñas
            </p>

            <h1>
              Attendance Monitoring<br />
              Library Management System
            </h1>
          </div>

          <div class="header-actions">
            <span
              id="session-label"
              class="session-label"
              hidden
            ></span>

            <button
              id="logout-button"
              class="button button-header"
              type="button"
              hidden
            >
              Log out
            </button>
          </div>
        </header>

        <main
          id="main-content"
          class="page-stage"
        >
          <section
            class="panel table-panel"
            aria-labelledby="active-title"
          >
            <div class="screen-heading split-heading">
              <div>
                <p class="eyebrow">
                  Live desk view
                </p>

                <h2 id="active-title">
                  Currently-In List
                </h2>

                <p id="active-description">
                  Only active visits are shown.
                </p>
              </div>

              <a
                class="button button-dashboard button-link"
                href="dashboard.html"
              >
                ← Dashboard
              </a>
            </div>

            <div class="table-wrap">
              <table>
                <caption class="sr-only">
                  Visitors currently in the library
                </caption>

                <thead>
                  <tr>
                    <th scope="col">User ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Time-in</th>
                    <th scope="col">Action</th>
                  </tr>
                </thead>

                <tbody id="active-table-body"></tbody>
              </table>
            </div>

            <p
              id="active-empty"
              class="empty-state"
              hidden
            >
              No one is currently checked in.
            </p>
          </section>
        </main>
      </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="access.js"></script>
    <script src="javascript-stuff.js"></script>
  </body>
</html>
