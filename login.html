<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Staff Sign In | Library Visit Desk</title>

    <link rel="stylesheet" href="ui-structure.css" />
  </head>

  <body>
    <main class="app-shell">
      <a
        class="skip-link"
        href="#main-content"
      >
        Skip to main content
      </a>

      <div class="page-wrap">
        <header class="masthead">
          <div class="brand-mark">
            <img
              src="assets/NUD-LRC.jpg"
              alt="School Logo"
            />
          </div>

          <div class="system-name">
            <p class="school-name">
              National University - Dasmariñas
            </p>

            <h1>
              Attendance Monitoring<br />
              Library Management System
            </h1>
          </div>
        </header>

        <main
          id="main-content"
          class="page-stage"
        >
          <section
            class="panel narrow"
            aria-labelledby="login-title"
          >
            <div class="screen-heading">
              <p class="eyebrow">Staff access</p>

              <h2 id="login-title">
                Sign in
              </h2>

              <p>
                Use your authorized library staff account.
              </p>
            </div>

            <form
              id="login-form"
              novalidate
            >
              <div class="field">
                <label for="staff-id">
                  User ID / Staff ID
                </label>

                <input
                  id="staff-id"
                  name="staffId"
                  autocomplete="username"
                  placeholder="e.g., 1234-567890"
                  required
                />
              </div>

              <div class="field">
                <label for="password">
                  Password
                </label>

                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <p
                id="login-error"
                class="validation-message"
                role="alert"
                hidden
              >
                Enter a staff ID and a password with at least 4 characters.
              </p>

              <div class="form-actions">
                <a
                  class="button button-secondary button-link"
                  href="welcome.html"
                >
                  Back
                </a>

                <button
                  class="button button-primary"
                  type="submit"
                >
                  Log in
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </main>

    <script src="javascript-stuff.js"></script>
  </body>
</html>
